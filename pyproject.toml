[project]
name = "vc-scout"
version = "0.1.0"
description = "AI-augmented investment triage pipeline for a seed-stage VC firm"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.15.1",
    "pydantic>=2.10.0",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
]

[project.scripts]
vc-scout = "vc_scout.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vc_scout"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RET", "ARG", "TID", "S"]
ignore = ["S101"]  # assert is fine in tests and in internal invariants

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]
# The pipeline commands declare their full signature while their bodies are still
# placeholders. Remove this entry as each stage lands and starts using its arguments.
"src/vc_scout/cli.py" = ["ARG001"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
